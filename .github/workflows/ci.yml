name: Edge Agent CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Lint con Ruff
      run: ruff check src/ tests/

    - name: Type check con Mypy
      run: mypy src/ --ignore-missing-imports

    - name: Tests con pytest
      run: pytest tests/ -v --tb=short

    - name: Validar sintaxis con Compileall
      run: python -m compileall src/

    - name: Validar scripts Bash
      run: |
        for file in scripts/*; do
          [ -f "$file" ] || continue
          first_line="$(head -n 1 "$file" || true)"
          if printf '%s' "$first_line" | grep -Eq 'bash|/bin/sh|/usr/bin/env bash|/usr/bin/env sh'; then
            bash -n "$file"
          fi
        done

    - name: Validar systemd units (si está disponible)
      run: |
        if command -v systemd-analyze >/dev/null 2>&1; then
          systemd-analyze verify systemd/*.service systemd/*.timer
        else
          echo "systemd-analyze no disponible en runner; omitido."
        fi
