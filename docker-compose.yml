version: "3.8"

services:
  flask:
    build: .
    container_name: edge-sec-flask
    hostname: flask
    environment:
      - EDGE_DB_PATH=/app/data/history.db
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-edge_sec_demo}
    volumes:
      - edge-sec-data:/app/data
    command: >
      gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 wsgi:app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/v1/global/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: edge-sec-nginx
    depends_on:
      flask:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - edge-sec-ssl:/etc/nginx/ssl
      - edge-sec-htpasswd:/etc/nginx/.htpasswd
    environment:
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-edge_sec_demo}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  edge-sec-data:
  edge-sec-ssl:
  edge-sec-htpasswd:
