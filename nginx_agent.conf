# Rate Limiting Zone: 10MB shared memory, 5 req/s por IP
limit_req_zone $binary_remote_addr zone=edge_sec_limit:10m rate=5r/s;

server {
    listen 8443 ssl;
    server_name _;

    # TLS Certificate & Key
    ssl_certificate /etc/ssl/certs/edge-sec-agent.crt;
    ssl_certificate_key /etc/ssl/private/edge-sec-agent.key;

    # TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    # Request Size Limit
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/edge-sec-agent-access.log;
    error_log /var/log/nginx/edge-sec-agent-error.log;

    # Security Headers (applied globally)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    # Basic Authentication
    auth_basic "Edge Security Agent — Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Rate Limiting applied to all locations
    limit_req zone=edge_sec_limit burst=10 nodelay;
    limit_req_status 429;

    # Main Dashboard & API
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:5000/v1/global/health;
        proxy_set_header Host $host;
    }

    # Prometheus Metrics Endpoint
    location /metrics {
        proxy_pass http://127.0.0.1:5000/metrics;
        proxy_set_header Host $host;
    }

    # API Metrics Endpoint
    location /api/metrics {
        proxy_pass http://127.0.0.1:5000/api/metrics;
        proxy_set_header Host $host;
    }
}
